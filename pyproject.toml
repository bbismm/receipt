[project]
name = "receipt-trade"
version = "0.1.1"
description = "Open standard for publicly-verifiable AI agent activity logs (Receipt Spec v0.1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "iBitLabs", email = "hello@ibitlabs.com" }]
keywords = ["audit", "trading", "ai-agent", "transparency", "verifiable"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/AgentBonnybb/receipt"
Spec = "https://github.com/AgentBonnybb/receipt/blob/main/SPEC.md"
ReferenceAdopter = "https://receipt.ibitlabs.com/sniper-v5.1"

[project.scripts]
receipt = "receipt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["receipt"]
